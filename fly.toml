# Fly.io app config. `app` below is a placeholder — Fly app names are global
# across every Fly user, so "studybuddy" itself will almost certainly be
# taken. Run `fly apps create` first (it'll suggest an available name, or
# let you pick one), then put that exact name here before your first
# `fly deploy`. See HOSTING-FLYIO.md.

app = "studybuddy-jobble"
primary_region = "ams"   # Amsterdam — closest major Fly region to Sweden

[build]
  dockerfile = "Dockerfile"

# Non-secret settings — safe to commit. The real secrets (ANTHROPIC_API_KEY,
# SITE_PASSWORD) are set with `fly secrets set`, never written here.
[env]
  COOKIE_SECURE = "true"
  MESSAGES_REQUIRE_AUTH = "true"
  DB_PATH = "/data/studybuddy.sqlite3"   # on the persistent volume below

[http_service]
  internal_port = 8787
  force_https = true
  # Two of you will open this at odd hours to test — no scale-to-zero pause,
  # no wake-up delay.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# The SQLite database file lives here so it survives every redeploy — this
# is the exact problem that reset the database on every deploy on Render's
# free tier. Create it once: `fly volumes create studybuddy_data -r ams -s 1`
[mounts]
  source = "studybuddy_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
