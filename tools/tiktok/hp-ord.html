<!doctype html>
<!-- "Dagens HP-ord": one 1080×1920 image for TikTok (or Reels/Shorts) from the ORD word bank.
     ?i=<0-based index in data/library/hp-ord-bank-01.json>&frame=q|a&n=<series number, default i+1>
       q = the question: the word and its five options; a = the answer marked, with the explanation.
     render-hp-ord.mjs (next to this file) shoots every word; open this page in a browser at
     1080×1920 to look at one. Everything that matters sits inside TikTok's safe area: nothing under
     the top tabs, the caption and sound line at the bottom, or the like/comment column on the right. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Dagens HP-ord</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400 800; src: url("../../assets/fonts/inter-latin.woff2") format("woff2"); }
  @font-face { font-family: "Lexend"; font-weight: 700; src: url("../../assets/fonts/lexend-700-latin.woff2") format("woff2"); }

  /* The logo's own colours: its navy tile and its three bars. */
  :root {
    --navy-1: #26335E; --navy-2: #151C33;
    --bar-1: #5B8CFF; --bar-2: #7A6BFF; --bar-3: #38D2FF;
    --ink: #151C33; --ink-soft: #4A5372; --faint: #8A91A8;
    --chip: #EEF2FF; --chip-ink: #2C5CD6;
    --ok: #1B7A50; --ok-bright: #2FA36B; --ok-tint: #E4F5EC;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1080px; height: 1920px; overflow: hidden; color: #fff;
    font-family: "Inter", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--navy-1) 0%, var(--navy-2) 100%);
  }
  .frame { position: relative; height: 100%; padding: 200px 120px 470px; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 76px; height: 76px; }
  .brand span { font-family: "Lexend", "Inter", sans-serif; font-weight: 700; font-size: 46px; letter-spacing: -.035em; transform: skewX(-9deg); }

  /* "safe center": if a long word or explanation ever makes this taller than the space, it grows down
     into the margin instead of up over the logo. */
  .main { flex: 1; display: flex; flex-direction: column; justify-content: safe center; gap: 30px; min-height: 0; margin-top: 30px; }
  .series {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 26px 12px 20px; border-radius: 999px; font-size: 34px; font-weight: 700;
    background: rgba(91, 140, 255, .18); border: 2px solid rgba(91, 140, 255, .45); color: #DCE6FF;
  }
  .series i { width: 16px; height: 16px; border-radius: 50%; background: var(--bar-3); }
  .word {
    margin: 0; font-family: "Lexend", "Inter", sans-serif; font-weight: 700; line-height: 1;
    font-size: 160px; letter-spacing: -.03em; white-space: nowrap; padding-bottom: 12px;
  }
  .ask { margin: -6px 0 0; font-size: 44px; line-height: 1.3; font-weight: 500; color: rgba(255, 255, 255, .82); }

  .card { background: #fff; border-radius: 44px; padding: 26px; display: grid; gap: 6px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
  .opt { display: flex; align-items: center; gap: 26px; padding: 16px 22px; border-radius: 28px; color: var(--ink); font-size: 46px; font-weight: 600; line-height: 1.2; }
  .opt b {
    flex: none; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center;
    font-size: 34px; font-weight: 800; background: var(--chip); color: var(--chip-ink);
  }
  .opt b svg { width: 40px; height: 40px; }
  .is-a .opt { color: var(--faint); }
  .is-a .opt b { background: #F1F3F8; color: var(--faint); }
  .is-a .opt.is-right { color: var(--ok); background: var(--ok-tint); box-shadow: inset 0 0 0 4px var(--ok-bright); font-weight: 800; }
  .is-a .opt.is-right b { background: var(--ok-bright); color: #fff; }

  .why { margin: 0; font-size: 40px; line-height: 1.4; color: rgba(255, 255, 255, .86); }
  .foot { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 600; color: #DCE6FF; }
  .foot svg { flex: none; width: 44px; height: 44px; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script type="module">
  const p = new URLSearchParams(location.search);
  const i = Number(p.get("i") || 0);
  const answer = p.get("frame") === "a";
  const n = p.get("n") || i + 1;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';

  const bank = await (await fetch("../../data/library/hp-ord-bank-01.json")).json();
  const q = bank.questions[i];
  const word = q.prompt.match(/\*\*(.+?)\*\*/)[1];

  const options = q.choices.map((c, k) => {
    const right = answer && k === q.answer;
    return `<div class="opt${right ? " is-right" : ""}"><b>${right ? CHECK : "ABCDE"[k]}</b><span>${esc(c)}</span></div>`;
  }).join("");

  document.getElementById("frame").innerHTML = `
    <div class="brand"><img src="../../assets/favicon.svg" alt=""><span>PluggEra</span></div>
    <div class="main${answer ? " is-a" : ""}">
      <span class="series"><i></i>Dagens HP-ord #${esc(n)}${answer ? " · Svar" : ""}</span>
      <h1 class="word">${esc(word)}</h1>
      ${answer ? "" : `<p class="ask">Vilket ligger närmast i betydelse?</p>`}
      <div class="card">${options}</div>
      ${answer && q.explanation ? `<p class="why">${esc(q.explanation)}</p>` : ""}
      <p class="foot">${answer ? `${ARROW}Öva fler HP-ord på pluggera.se` : `${CHAT}Svara i kommentarerna`}</p>
    </div>`;

  // The word is as big as the line allows: long ones ("tendentiös", "kategorisk") step down to fit.
  await document.fonts.ready;
  const w = document.querySelector(".word");
  let size = 160;
  while (w.scrollWidth > w.clientWidth && size > 90) w.style.fontSize = `${(size -= 4)}px`;
  document.body.dataset.ready = "1";
</script>
</body>
</html>
