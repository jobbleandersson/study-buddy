<!doctype html>
<!-- "Dagens HP-ord": one 1080×1920 image for TikTok (or Reels/Shorts) from the ORD word bank.
     ?i=<0-based index in data/library/hp-ord-bank-01.json>&frame=q|a&n=<series number, default i+1>
       q = the question: the word and its five options; a = the answer marked, with the explanation.
     render-hp-ord.mjs (next to this file) shoots every word; open this page in a browser at
     1080×1920 to look at one. The shared look (colours, cards, safe area) is in slides.css. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Dagens HP-ord</title>
<link rel="stylesheet" href="slides.css">
<style>
  .btn { padding: 22px 38px; font-size: 38px; }
</style>
</head>
<body data-series="ord">
<div class="frame" id="frame"></div>
<script type="module">
  const p = new URLSearchParams(location.search);
  const i = Number(p.get("i") || 0);
  const answer = p.get("frame") === "a";
  const n = p.get("n") || i + 1;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
  const CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" stroke-width="3.2"/></svg>';

  const bank = await (await fetch("../../data/library/hp-ord-bank-01.json")).json();
  const q = bank.questions[i];
  const word = q.prompt.match(/\*\*(.+?)\*\*/)[1];

  const options = q.choices.map((c, k) => {
    const right = answer && k === q.answer;
    return `<div class="opt${right ? " is-right" : ""}"><b>${right ? CHECK : "ABCDE"[k]}</b><span>${esc(c)}</span></div>`;
  }).join("");

  document.getElementById("frame").innerHTML = `
    <div class="top">
      <div class="brand"><img src="../../assets/favicon.svg" alt=""><span>PluggEra</span></div>
      <span class="series">Dagens HP-ord #${esc(n)}</span>
    </div>
    <div class="main${answer ? " is-answer" : ""}">
      <p class="label">${answer ? "Svaret" : "ORD · Ordförståelse"}</p>
      <div class="card flash"><h1 class="word">${esc(word)}</h1><p>${answer ? "betyder ungefär …" : "Vilket ligger närmast i betydelse?"}</p></div>
      <div class="card opts">${answer ? `<span class="verdict">Rätt svar: ${"ABCDE"[q.answer]}</span>` : ""}${options}</div>
      ${answer
        ? `${q.explanation ? `<div class="card note"><h3>Därför</h3>${esc(q.explanation)}</div>` : ""}<span class="btn">${LINK}Öva fler HP-ord på pluggera.se/hp</span>`
        : `<p class="bubble">${CHAT}<span>Svara i kommentarerna</span></p>`}
    </div>
    <div class="foot"><span class="site">pluggera.se</span><span class="dots"><i${answer ? "" : ' class="on"'}></i><i${answer ? ' class="on"' : ""}></i></span></div>`;

  // The word is as big as the card allows: long ones ("tendentiös", "kategorisk") step down to fit.
  // A long explanation scales the whole slide down a little rather than run into TikTok's caption.
  await document.fonts.ready;
  const w = document.querySelector(".word");
  let size = parseFloat(getComputedStyle(w).fontSize);
  while (w.scrollWidth > w.clientWidth && size > 72) w.style.fontSize = `${(size -= 4)}px`;
  const main = document.querySelector(".main");
  let scale = 1;
  while (main.scrollHeight > main.clientHeight + 2 && scale > 0.76) main.style.zoom = String((scale = Math.round((scale - 0.04) * 100) / 100));
  document.body.dataset.ready = "1";
</script>
</body>
</html>
