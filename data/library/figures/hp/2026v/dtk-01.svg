<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img" aria-label="Stapeldiagram över invånarantal i tusental för fem kommuner.">
  <style>
    .ax{stroke:#6b7280;stroke-width:1;fill:none}
    .grid{stroke:#c9ced8;stroke-width:1;stroke-dasharray:2 3}
    .bar{fill:#8aa0c8}
    .lab{fill:#6b7280;font:9px system-ui,sans-serif}
    .val{fill:#3f4756;font:8px system-ui,sans-serif;text-anchor:middle}
    .title{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    @media (prefers-color-scheme:dark){
      .ax{stroke:#9aa3b4}.grid{stroke:#3a4150}.bar{fill:#6e93f6}
      .lab,.val,.title{fill:#c3c9d6}
    }
  </style>
  <text class="title" x="12" y="16">Invånarantal (tusental), 2024</text>
  <line class="ax" x1="40" y1="26" x2="40" y2="176"/>
  <line class="ax" x1="40" y1="176" x2="326" y2="176"/>
  <line class="grid" x1="40" y1="126" x2="326" y2="126"/>
  <line class="grid" x1="40" y1="76" x2="326" y2="76"/>
  <text class="lab" x="34" y="179" text-anchor="end">0</text>
  <text class="lab" x="34" y="129" text-anchor="end">40</text>
  <text class="lab" x="34" y="79" text-anchor="end">80</text>
  <text class="lab" x="34" y="30" text-anchor="end">120</text>
  <rect class="bar" x="52" y="46" width="34" height="130"/>
  <rect class="bar" x="106" y="96" width="34" height="80"/>
  <rect class="bar" x="160" y="121" width="34" height="55"/>
  <rect class="bar" x="214" y="151" width="34" height="25"/>
  <rect class="bar" x="268" y="146" width="34" height="30"/>
  <text class="val" x="69" y="42">104</text>
  <text class="val" x="123" y="92">64</text>
  <text class="val" x="177" y="117">44</text>
  <text class="val" x="231" y="147">20</text>
  <text class="val" x="285" y="142">24</text>
  <text class="lab" x="69" y="190" text-anchor="middle">Alby</text>
  <text class="lab" x="123" y="190" text-anchor="middle">Berga</text>
  <text class="lab" x="177" y="190" text-anchor="middle">Cedern</text>
  <text class="lab" x="231" y="190" text-anchor="middle">Dala</text>
  <text class="lab" x="285" y="190" text-anchor="middle">Ekhult</text>
</svg>
