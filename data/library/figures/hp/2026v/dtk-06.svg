<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 206" role="img" aria-label="Tabell: gymnasieelever per program i Västerby län 2025, med antal elever, andel kvinnor och andel med högskolebehörighet.">
  <style>
    .g{stroke:#c9ced8;stroke-width:1}
    .h{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .c{fill:#3f4756;font:10px system-ui,sans-serif}
    .t{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .n{fill:#6b7280;font:8.5px system-ui,sans-serif}
    .r{text-anchor:end}
    @media (prefers-color-scheme:dark){
      .g{stroke:#3a4150}.h,.c,.t{fill:#c3c9d6}.n{fill:#9aa3b4}
    }
  </style>
  <text class="t" x="12" y="16">Gymnasieelever per program, Västerby län 2025</text>
  <line class="g" x1="12" y1="26" x2="328" y2="26"/>
  <text class="h" x="16" y="44">Program</text>
  <text class="h r" x="184" y="44">Elever</text>
  <text class="h r" x="252" y="44">Kvinnor (%)</text>
  <text class="h r" x="326" y="44">Behöriga (%)</text>
  <line class="g" x1="12" y1="52" x2="328" y2="52"/>
  <text class="c" x="16" y="70">Ekonomi</text><text class="c r" x="184" y="70">820</text><text class="c r" x="252" y="70">58</text><text class="c r" x="326" y="70">90</text>
  <text class="c" x="16" y="90">Naturvetenskap</text><text class="c r" x="184" y="90">640</text><text class="c r" x="252" y="90">52</text><text class="c r" x="326" y="90">94</text>
  <text class="c" x="16" y="110">Teknik</text><text class="c r" x="184" y="110">560</text><text class="c r" x="252" y="110">25</text><text class="c r" x="326" y="110">86</text>
  <text class="c" x="16" y="130">Samhällsvetenskap</text><text class="c r" x="184" y="130">900</text><text class="c r" x="252" y="130">64</text><text class="c r" x="326" y="130">88</text>
  <text class="c" x="16" y="150">Vård och omsorg</text><text class="c r" x="184" y="150">300</text><text class="c r" x="252" y="150">80</text><text class="c r" x="326" y="150">41</text>
  <line class="g" x1="12" y1="160" x2="328" y2="160"/>
  <text class="t" x="16" y="178">Totalt</text><text class="t r" x="184" y="178">3 220</text>
  <text class="n" x="12" y="198">Behöriga: andel som fick grundläggande högskolebehörighet med sin examen.</text>
</svg>
