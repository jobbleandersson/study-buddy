  <text class="c" x="16" y="92">Q2</text><text class="c" x="150" y="92">135</text><text class="c" x="260" y="92">12</text>
  <text class="c" x="16" y="114">Q3</text><text class="c" x="150" y="114">128</text><text class="c" x="260" y="114">-3</text>
  <text class="c" x="16" y="136">Q4</text><text class="c" x="150" y="136">160</text><text class="c" x="260" y="136">21</text>
  <line class="g" x1="12" y1="146" x2="328" y2="146"/>
  <text class="t" x="16" y="164">Helår</text><text class="t" x="150" y="164">543</text><text class="t" x="260" y="164">38</text>
