<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 224" role="img" aria-label="Kombinerat diagram för kollektivtrafiken i Västerby 2020–2025: staplar visar antal resor i miljoner mot vänster axel, en linje visar andelen resor betalda med app i procent mot höger axel.">
  <style>
    .ax{stroke:#6b7280;stroke-width:1;fill:none}
    .grid{stroke:#c9ced8;stroke-width:1;stroke-dasharray:2 3}
    .bar{fill:#c6cfe0}
    .line{stroke:#2c5cd6;stroke-width:2;fill:none}
    .dot{fill:#2c5cd6}
    .lab{fill:#6b7280;font:9px system-ui,sans-serif}
    .val{fill:#2c3340;font:8px system-ui,sans-serif;text-anchor:middle}
    .pct{fill:#2c5cd6;font:bold 8px system-ui,sans-serif}
    .title{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    @media (prefers-color-scheme:dark){
      .ax{stroke:#9aa3b4}.grid{stroke:#3a4150}.bar{fill:#3e5390}
      .line{stroke:#8fb0ff}.dot,.pct{fill:#8fb0ff}
      .lab,.title{fill:#c3c9d6}.val{fill:#e8ebf2}
    }
  </style>
  <text class="title" x="12" y="16">Kollektivtrafik i Västerby 2020–2025</text>
  <!-- left axis: 0–40 miljoner resor (3.5 px per miljon); right axis: 0–100 % (1.4 px per procentenhet) -->
  <line class="grid" x1="40" y1="141" x2="306" y2="141"/>
  <line class="grid" x1="40" y1="106" x2="306" y2="106"/>
  <line class="grid" x1="40" y1="71" x2="306" y2="71"/>
  <line class="grid" x1="40" y1="36" x2="306" y2="36"/>
  <text class="lab" x="34" y="179" text-anchor="end">0</text>
  <text class="lab" x="34" y="144" text-anchor="end">10</text>
  <text class="lab" x="34" y="109" text-anchor="end">20</text>
  <text class="lab" x="34" y="74" text-anchor="end">30</text>
  <text class="lab" x="34" y="39" text-anchor="end">40</text>
  <text class="lab" x="312" y="179">0</text>
  <text class="lab" x="312" y="144">25</text>
  <text class="lab" x="312" y="109">50</text>
  <text class="lab" x="312" y="74">75</text>
  <text class="lab" x="312" y="39">100</text>
  <rect class="bar" x="50.2" y="113" width="24" height="63"/><text class="val" x="62.2" y="109">18</text>
  <rect class="bar" x="94.5" y="99" width="24" height="77"/><text class="val" x="106.5" y="95">22</text>
  <rect class="bar" x="138.8" y="78" width="24" height="98"/><text class="val" x="150.8" y="74">28</text>
  <rect class="bar" x="183.2" y="64" width="24" height="112"/><text class="val" x="195.2" y="60">32</text>
  <rect class="bar" x="227.5" y="57" width="24" height="119"/><text class="val" x="239.5" y="53">34</text>
  <rect class="bar" x="271.8" y="50" width="24" height="126"/><text class="val" x="283.8" y="46">36</text>
  <line class="ax" x1="40" y1="30" x2="40" y2="176"/>
  <line class="ax" x1="306" y1="30" x2="306" y2="176"/>
  <line class="ax" x1="40" y1="176" x2="306" y2="176"/>
  <polyline class="line" points="62.2,148 106.5,127 150.8,106 195.2,92 239.5,78 283.8,71"/>
  <circle class="dot" cx="62.2" cy="148" r="3"/><text class="pct" x="75.2" y="151">20</text>
  <circle class="dot" cx="106.5" cy="127" r="3"/><text class="pct" x="119.5" y="130">35</text>
  <circle class="dot" cx="150.8" cy="106" r="3"/><text class="pct" x="163.8" y="109">50</text>
  <circle class="dot" cx="195.2" cy="92" r="3"/><text class="pct" x="208.2" y="95">60</text>
  <circle class="dot" cx="239.5" cy="78" r="3"/><text class="pct" x="252.5" y="81">70</text>
  <circle class="dot" cx="283.8" cy="71" r="3"/><text class="pct" x="283.8" y="64" text-anchor="middle">75</text>
  <text class="lab" x="62.2" y="189" text-anchor="middle">2020</text>
  <text class="lab" x="106.5" y="189" text-anchor="middle">2021</text>
  <text class="lab" x="150.8" y="189" text-anchor="middle">2022</text>
  <text class="lab" x="195.2" y="189" text-anchor="middle">2023</text>
  <text class="lab" x="239.5" y="189" text-anchor="middle">2024</text>
  <text class="lab" x="283.8" y="189" text-anchor="middle">2025</text>
  <rect class="bar" x="12" y="199" width="12" height="8"/>
  <text class="lab" x="29" y="206">Antal resor, miljoner (vänster axel)</text>
  <line class="line" x1="12" y1="217" x2="24" y2="217"/><circle class="dot" cx="18" cy="217" r="2.5"/>
  <text class="lab" x="29" y="220">Andel resor betalda med app, % (höger axel)</text>
</svg>
