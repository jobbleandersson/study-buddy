<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img" aria-label="Grupperat stapeldiagram: andel (procent) vattenkraft respektive vindkraft av elproduktionen i tre länder A, B och C.">
  <style>
    .ax{stroke:#6b7280;stroke-width:1;fill:none}
    .grid{stroke:#c9ced8;stroke-width:1;stroke-dasharray:2 3}
    .vatten{fill:#8aa0c8}.vind{fill:#c6cfe0}
    .lab{fill:#6b7280;font:9px system-ui,sans-serif}
    .val{fill:#2c3340;font:8px system-ui,sans-serif;text-anchor:middle}
    .title{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    @media (prefers-color-scheme:dark){
      .ax{stroke:#9aa3b4}.grid{stroke:#3a4150}
      .vatten{fill:#6e93f6}.vind{fill:#3e5390}
      .lab,.title{fill:#c3c9d6}.val{fill:#e8ebf2}
    }
  </style>
  <text class="title" x="12" y="16">Andel av elproduktionen (%)</text>
  <line class="ax" x1="40" y1="26" x2="40" y2="166"/>
  <line class="ax" x1="40" y1="166" x2="320" y2="166"/>
  <line class="grid" x1="40" y1="119" x2="320" y2="119"/>
  <line class="grid" x1="40" y1="73" x2="320" y2="73"/>
  <text class="lab" x="34" y="169" text-anchor="end">0</text>
  <text class="lab" x="34" y="122" text-anchor="end">20</text>
  <text class="lab" x="34" y="76" text-anchor="end">40</text>
  <text class="lab" x="34" y="30" text-anchor="end">60</text>
  <!-- Land A: vatten 55, vind 10 -->
  <rect class="vatten" x="60" y="39" width="22" height="127"/><text class="val" x="71" y="35">55</text>
  <rect class="vind"   x="84" y="143" width="22" height="23"/><text class="val" x="95" y="139">10</text>
  <text class="lab" x="83" y="180" text-anchor="middle">Land A</text>
  <!-- Land B: vatten 15, vind 45 -->
  <rect class="vatten" x="150" y="131" width="22" height="35"/><text class="val" x="161" y="127">15</text>
  <rect class="vind"   x="174" y="62" width="22" height="104"/><text class="val" x="185" y="58">45</text>
  <text class="lab" x="173" y="180" text-anchor="middle">Land B</text>
  <!-- Land C: vatten 25, vind 25 -->
  <rect class="vatten" x="240" y="108" width="22" height="58"/><text class="val" x="251" y="104">25</text>
  <rect class="vind"   x="264" y="108" width="22" height="58"/><text class="val" x="275" y="104">25</text>
  <text class="lab" x="263" y="180" text-anchor="middle">Land C</text>
  <rect class="vatten" x="60" y="194" width="10" height="10"/><text class="lab" x="74" y="203">Vattenkraft</text>
  <rect class="vind" x="150" y="194" width="10" height="10"/><text class="lab" x="164" y="203">Vindkraft</text>
</svg>
