<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Linjediagram över prisindex för livsmedel 2020–2025, där 2020 är 100.">
  <style>
    .ax{stroke:#6b7280;stroke-width:1;fill:none}
    .grid{stroke:#c9ced8;stroke-width:1;stroke-dasharray:2 3}
    .lab{fill:#6b7280;font:9px system-ui,sans-serif}
    .val{fill:#3f4756;font:8px system-ui,sans-serif;text-anchor:middle}
    .title{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .g{stroke:#c9ced8;stroke-width:1}
    .h{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .c{fill:#3f4756;font:10px system-ui,sans-serif}
    .n{fill:#6b7280;font:8.5px system-ui,sans-serif}
    .r{text-anchor:end}
    .s1{fill:#8aa0c8}.s2{fill:#e0a060}
    .l1{stroke:#5b78b8;stroke-width:2;fill:none}.l2{stroke:#d08840;stroke-width:2;fill:none}
    .d1{fill:#5b78b8}.d2{fill:#d08840}
    .p1{fill:#6e93f6}.p2{fill:#e0a060}.p3{fill:#57b894}.p4{fill:#e5c453}.p5{fill:#a3a9b7}
    .slice{stroke:#ffffff;stroke-width:1.5}
    @media (prefers-color-scheme:dark){
      .ax{stroke:#9aa3b4}.grid,.g{stroke:#3a4150}
      .lab,.n{fill:#9aa3b4}.val,.title,.h,.c{fill:#c3c9d6}
      .s1{fill:#6e93f6}.s2{fill:#e8a86a}
      .l1{stroke:#7fa0ff}.l2{stroke:#f0a860}.d1{fill:#7fa0ff}.d2{fill:#f0a860}
      .slice{stroke:#141821}
    }
  </style>
  <text class="title" x="12" y="16">Prisindex för livsmedel (2020 = 100)</text>
  <line class="ax" x1="40" y1="30" x2="40" y2="176"/>
  <line class="ax" x1="40" y1="176" x2="326" y2="176"/>
  <line class="grid" x1="40" y1="148.0" x2="326" y2="148.0"/>
  <line class="grid" x1="40" y1="120.0" x2="326" y2="120.0"/>
  <line class="grid" x1="40" y1="92.0" x2="326" y2="92.0"/>
  <line class="grid" x1="40" y1="64.0" x2="326" y2="64.0"/>
  <line class="grid" x1="40" y1="36.0" x2="326" y2="36.0"/>
  <text class="lab r" x="34" y="179.0">90</text>
  <text class="lab r" x="34" y="151.0">100</text>
  <text class="lab r" x="34" y="123.0">110</text>
  <text class="lab r" x="34" y="95.0">120</text>
  <text class="lab r" x="34" y="67.0">130</text>
  <text class="lab r" x="34" y="39.0">140</text>
  <polyline class="l1" points="62.0,148.0 110.4,142.4 158.8,114.4 207.2,78.0 255.6,72.4 304.0,61.2"/>
  <circle class="d1" cx="62.0" cy="148.0" r="2.6"/><text class="val" x="62.0" y="142.0">100</text>
  <text class="lab" x="62.0" y="190" text-anchor="middle">2020</text>
  <circle class="d1" cx="110.4" cy="142.4" r="2.6"/><text class="val" x="110.4" y="136.4">102</text>
  <text class="lab" x="110.4" y="190" text-anchor="middle">2021</text>
  <circle class="d1" cx="158.8" cy="114.4" r="2.6"/><text class="val" x="158.8" y="108.4">112</text>
  <text class="lab" x="158.8" y="190" text-anchor="middle">2022</text>
  <circle class="d1" cx="207.2" cy="78.0" r="2.6"/><text class="val" x="207.2" y="72.0">125</text>
  <text class="lab" x="207.2" y="190" text-anchor="middle">2023</text>
  <circle class="d1" cx="255.6" cy="72.4" r="2.6"/><text class="val" x="255.6" y="66.4">127</text>
  <text class="lab" x="255.6" y="190" text-anchor="middle">2024</text>
  <circle class="d1" cx="304.0" cy="61.2" r="2.6"/><text class="val" x="304.0" y="55.2">131</text>
  <text class="lab" x="304.0" y="190" text-anchor="middle">2025</text>
</svg>
