<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Cirkeldiagram över elproduktionen 2025 fördelad på kraftslag. Total produktion 160 TWh.">
  <style>
    .ax{stroke:#6b7280;stroke-width:1;fill:none}
    .grid{stroke:#c9ced8;stroke-width:1;stroke-dasharray:2 3}
    .lab{fill:#6b7280;font:9px system-ui,sans-serif}
    .val{fill:#3f4756;font:8px system-ui,sans-serif;text-anchor:middle}
    .title{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .g{stroke:#c9ced8;stroke-width:1}
    .h{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .c{fill:#3f4756;font:10px system-ui,sans-serif}
    .n{fill:#6b7280;font:8.5px system-ui,sans-serif}
    .r{text-anchor:end}
    .s1{fill:#8aa0c8}.s2{fill:#e0a060}
    .l1{stroke:#5b78b8;stroke-width:2;fill:none}.l2{stroke:#d08840;stroke-width:2;fill:none}
    .d1{fill:#5b78b8}.d2{fill:#d08840}
    .p1{fill:#6e93f6}.p2{fill:#e0a060}.p3{fill:#57b894}.p4{fill:#e5c453}.p5{fill:#a3a9b7}
    .slice{stroke:#ffffff;stroke-width:1.5}
    @media (prefers-color-scheme:dark){
      .ax{stroke:#9aa3b4}.grid,.g{stroke:#3a4150}
      .lab,.n{fill:#9aa3b4}.val,.title,.h,.c{fill:#c3c9d6}
      .s1{fill:#6e93f6}.s2{fill:#e8a86a}
      .l1{stroke:#7fa0ff}.l2{stroke:#f0a860}.d1{fill:#7fa0ff}.d2{fill:#f0a860}
      .slice{stroke:#141821}
    }
  </style>
  <text class="title" x="12" y="16">Elproduktion efter kraftslag, 2025 (andel i %)</text>
  <path class="p1 slice" d="M100,112 L100.0,34.0 A78,78 0 0 1 145.8,175.1 Z"/>
  <path class="p2 slice" d="M100,112 L145.8,175.1 A78,78 0 0 1 25.8,136.1 Z"/>
  <path class="p3 slice" d="M100,112 L25.8,136.1 A78,78 0 0 1 54.2,48.9 Z"/>
  <path class="p4 slice" d="M100,112 L54.2,48.9 A78,78 0 0 1 71.3,39.5 Z"/>
  <path class="p5 slice" d="M100,112 L71.3,39.5 A78,78 0 0 1 100.0,34.0 Z"/>
  <rect class="p1" x="204" y="41" width="11" height="11"/><text class="c" x="221" y="50">Vattenkraft</text><text class="c r" x="326" y="50">40 %</text>
  <rect class="p2" x="204" y="63" width="11" height="11"/><text class="c" x="221" y="72">Kärnkraft</text><text class="c r" x="326" y="72">30 %</text>
  <rect class="p3" x="204" y="85" width="11" height="11"/><text class="c" x="221" y="94">Vindkraft</text><text class="c r" x="326" y="94">20 %</text>
  <rect class="p4" x="204" y="107" width="11" height="11"/><text class="c" x="221" y="116">Solkraft</text><text class="c r" x="326" y="116">4 %</text>
  <rect class="p5" x="204" y="129" width="11" height="11"/><text class="c" x="221" y="138">Övrigt</text><text class="c r" x="326" y="138">6 %</text>
  <text class="n" x="204" y="176">Total produktion: 160 TWh</text>
</svg>
