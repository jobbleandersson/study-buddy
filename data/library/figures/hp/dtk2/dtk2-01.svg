<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Stapeldiagram över sålda elcyklar i tusental per kvartal, 2024 och 2025.">
  <style>
    .ax{stroke:#6b7280;stroke-width:1;fill:none}
    .grid{stroke:#c9ced8;stroke-width:1;stroke-dasharray:2 3}
    .lab{fill:#6b7280;font:9px system-ui,sans-serif}
    .val{fill:#3f4756;font:8px system-ui,sans-serif;text-anchor:middle}
    .title{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .g{stroke:#c9ced8;stroke-width:1}
    .h{fill:#3f4756;font:bold 10px system-ui,sans-serif}
    .c{fill:#3f4756;font:10px system-ui,sans-serif}
    .n{fill:#6b7280;font:8.5px system-ui,sans-serif}
    .r{text-anchor:end}
    .s1{fill:#8aa0c8}.s2{fill:#e0a060}
    .l1{stroke:#5b78b8;stroke-width:2;fill:none}.l2{stroke:#d08840;stroke-width:2;fill:none}
    .d1{fill:#5b78b8}.d2{fill:#d08840}
    .p1{fill:#6e93f6}.p2{fill:#e0a060}.p3{fill:#57b894}.p4{fill:#e5c453}.p5{fill:#a3a9b7}
    .slice{stroke:#ffffff;stroke-width:1.5}
    @media (prefers-color-scheme:dark){
      .ax{stroke:#9aa3b4}.grid,.g{stroke:#3a4150}
      .lab,.n{fill:#9aa3b4}.val,.title,.h,.c{fill:#c3c9d6}
      .s1{fill:#6e93f6}.s2{fill:#e8a86a}
      .l1{stroke:#7fa0ff}.l2{stroke:#f0a860}.d1{fill:#7fa0ff}.d2{fill:#f0a860}
      .slice{stroke:#141821}
    }
  </style>
  <text class="title" x="12" y="16">Sålda elcyklar (tusental) per kvartal</text>
  <rect class="s1" x="200" y="8" width="10" height="10"/><text class="lab" x="214" y="17">2024</text>
  <rect class="s2" x="250" y="8" width="10" height="10"/><text class="lab" x="264" y="17">2025</text>
  <line class="ax" x1="40" y1="30" x2="40" y2="176"/>
  <line class="ax" x1="40" y1="176" x2="326" y2="176"/>
  <line class="grid" x1="40" y1="129.3" x2="326" y2="129.3"/>
  <line class="grid" x1="40" y1="82.7" x2="326" y2="82.7"/>
  <line class="grid" x1="40" y1="36.0" x2="326" y2="36.0"/>
  <text class="lab r" x="34" y="179.0">0</text>
  <text class="lab r" x="34" y="132.3">10</text>
  <text class="lab r" x="34" y="85.7">20</text>
  <text class="lab r" x="34" y="39.0">30</text>
  <rect class="s1" x="52.0" y="129.3" width="24" height="46.7"/>
  <text class="val" x="64.0" y="126.3">10</text>
  <rect class="s2" x="78.0" y="106.0" width="24" height="70.0"/>
  <text class="val" x="90.0" y="103.0">15</text>
  <text class="lab" x="77.0" y="190" text-anchor="middle">Kv 1</text>
  <rect class="s1" x="123.5" y="92.0" width="24" height="84.0"/>
  <text class="val" x="135.5" y="89.0">18</text>
  <rect class="s2" x="149.5" y="54.7" width="24" height="121.3"/>
  <text class="val" x="161.5" y="51.7">26</text>
  <text class="lab" x="148.5" y="190" text-anchor="middle">Kv 2</text>
  <rect class="s1" x="195.0" y="54.7" width="24" height="121.3"/>
  <text class="val" x="207.0" y="51.7">26</text>
  <rect class="s2" x="221.0" y="59.3" width="24" height="116.7"/>
  <text class="val" x="233.0" y="56.3">25</text>
  <text class="lab" x="220.0" y="190" text-anchor="middle">Kv 3</text>
  <rect class="s1" x="266.5" y="110.7" width="24" height="65.3"/>
  <text class="val" x="278.5" y="107.7">14</text>
  <rect class="s2" x="292.5" y="82.7" width="24" height="93.3"/>
  <text class="val" x="304.5" y="79.7">20</text>
  <text class="lab" x="291.5" y="190" text-anchor="middle">Kv 4</text>
</svg>
