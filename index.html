<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyBuddy</title>
  <meta name="description" content="An AI study buddy that tutors you through your own assignments and tests." />
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6E4EF5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StudyBuddy" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Set the palette before first paint so there's no flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("studybuddy.theme");
        document.documentElement.setAttribute("data-theme",
          ["light", "dark", "system"].indexOf(t) >= 0 ? t : "system");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "system");
      }
    })();
  </script>

  <link rel="stylesheet" href="vendor/katex.min.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />

  <script src="vendor/canvas-confetti.min.js" defer></script>
  <script src="vendor/pdf.min.js" defer></script>
  <script src="vendor/katex.min.js" defer></script>
</head>
<body>
  <a class="skiplink" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript>StudyBuddy needs JavaScript enabled.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
