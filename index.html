  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />

  <!-- Math rendering (KaTeX) only appears inside specific components — most
       pages, including this one's own landing/marketing routes, never use it
       at all. Loaded with media="print" so the browser fetches it at normal
       priority but doesn't block first paint on it; js/boot.js flips it to
       the real media once it's in, so it's already applied by the time any
       page that does render math needs it. The noscript fallback is for the
       no-JS case only (the app itself already requires JS to run at all). -->
  <link id="katex-print-css" rel="stylesheet" href="vendor/katex.min.css" media="print" />
  <noscript><link rel="stylesheet" href="vendor/katex.min.css" /></noscript>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />

  <script src="vendor/canvas-confetti.min.js" defer></script>
  <script src="vendor/pdf.min.js" defer></script>
  <script src="vendor/katex.min.js" defer></script>
  <script src="vendor/jszip.min.js" defer></script>

  <!-- Sets the palette/font/language attributes <html> needs before first paint (no flash of the
       wrong one) and finishes the KaTeX media-swap above. A plain external script, not inline, so
       this page's Content-Security-Policy (server/src/index.js) needs no 'unsafe-inline' for scripts. -->
  <script src="js/boot.js"></script>
</head>
