<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyBuddy</title>
  <meta name="description" content="An AI study buddy that tutors you through your own assignments and tests." />
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6E4EF5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StudyBuddy" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Set the palette and language before first paint, so there's no flash of
       the wrong theme and <html lang> is right for screen readers from the start. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem("studybuddy.theme");
        root.setAttribute("data-theme", ["light", "dark", "system"].indexOf(t) >= 0 ? t : "system");
      } catch (e) {
        root.setAttribute("data-theme", "system");
      }
      try {
        var f = localStorage.getItem("studybuddy.font");
        root.setAttribute("data-font", f === "hyperlegible" ? "hyperlegible" : "system");
        var sz = localStorage.getItem("studybuddy.textSize");
        root.setAttribute("data-textsize", ["s", "m", "l"].indexOf(sz) >= 0 ? sz : "m");
      } catch (e) {
        root.setAttribute("data-font", "system");
        root.setAttribute("data-textsize", "m");
      }
      try {
        var supported = ["en", "sv"];
        var l = localStorage.getItem("studybuddy.lang");
        if (supported.indexOf(l) < 0) {
          l = "en";
          var tags = navigator.languages && navigator.languages.length
            ? navigator.languages : [navigator.language];
          for (var i = 0; i < tags.length; i++) {
            var base = String(tags[i] || "").toLowerCase().split("-")[0];
            if (supported.indexOf(base) >= 0) { l = base; break; }
          }
        }
        root.setAttribute("lang", l);
      } catch (e) {
        root.setAttribute("lang", "en");
      }
    })();
  </script>

  <link rel="stylesheet" href="vendor/katex.min.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />

  <script src="vendor/canvas-confetti.min.js" defer></script>
  <script src="vendor/pdf.min.js" defer></script>
  <script src="vendor/katex.min.js" defer></script>
  <script src="vendor/jszip.min.js" defer></script>
</head>
<body>
  <a class="skiplink" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript>StudyBuddy needs JavaScript enabled.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
