<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studify</title>
  <meta name="description" content="An AI study buddy that tutors you through your own assignments and tests." />
  <!-- Private staging: keep search engines out until the site is public. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2C5CD6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Studify" />

  <!-- Typefaces are served from this site (css/fonts.css), not Google Fonts: no third-party request on load. -->
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />

  <!-- Set the palette and language before first paint, so there's no flash of
       the wrong theme and <html lang> is right for screen readers from the start. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem("studybuddy.theme");
        root.setAttribute("data-theme", ["light", "paper", "dark", "system"].indexOf(t) >= 0 ? t : "system");
      } catch (e) {
        root.setAttribute("data-theme", "system");
      }
      try {
        var f = localStorage.getItem("studybuddy.font");
        root.setAttribute("data-font", f === "hyperlegible" ? "hyperlegible" : "system");
        var sz = localStorage.getItem("studybuddy.textSize");
        root.setAttribute("data-textsize", ["s", "m", "l"].indexOf(sz) >= 0 ? sz : "m");
      } catch (e) {
        root.setAttribute("data-font", "system");
        root.setAttribute("data-textsize", "m");
      }
      try {
        var supported = ["en", "sv"];
        var l = localStorage.getItem("studybuddy.lang");
        // Every bundled set is Swedish curriculum content, so that's the
        // default when the student hasn't chosen — not a browser-language guess.
        root.setAttribute("lang", supported.indexOf(l) >= 0 ? l : "sv");
      } catch (e) {
        root.setAttribute("lang", "sv");
      }
    })();
  </script>

  <!-- Math rendering (KaTeX) only appears inside specific components — most
       pages, including this one's own landing/marketing routes, never use it
       at all. Loaded with media="print" so the browser fetches it at normal
       priority but doesn't block first paint on it; onload flips it to the
       real media once it's in, so it's already applied by the time any page
       that does render math needs it. The noscript fallback is for the
       no-JS case only (the app itself already requires JS to run at all). -->
  <link rel="stylesheet" href="vendor/katex.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="vendor/katex.min.css" /></noscript>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />

  <script src="vendor/canvas-confetti.min.js" defer></script>
  <script src="vendor/pdf.min.js" defer></script>
  <script src="vendor/katex.min.js" defer></script>
  <script src="vendor/jszip.min.js" defer></script>
</head>
<body>
  <a class="skiplink" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript>Studify needs JavaScript enabled.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
