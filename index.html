<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <!-- pluggera.se is the only live domain. This file is also what GitHub Pages
       serves at jobbleandersson.github.io/study-buddy/ (same repo, no server-side
       redirect there) and the Fly app's fallback host, studybuddy-jobble.fly.dev
       (which does have a server-side redirect already, but this covers the
       edge case of served-from-cache / CDN-cached HTML on that host too) — bounce
       both of those to the real domain before anything else loads. -->
  <script>
    if (location.hostname !== "pluggera.se" && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      location.replace(
        "https://pluggera.se" +
        location.pathname.replace(/^\/study-buddy/, "") +
        location.search + location.hash
      );
    }
  </script>
  <!-- Every asset/script/data path below is relative. Without this, a request that falls through
       to this file from a deep path (a stale /ova/... link, a typo) resolves them against THAT
       path instead of the site root — a blank, unstyled page with every request 404ing. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PluggEra</title>
  <meta name="description" content="Plugga smartare med PluggEra: färdiga övningsset för åk 7 till gymnasiet och högskoleprovet, en handledare som förklarar, och repetition precis innan du glömmer. Gratis och utan reklam." />
  <!-- Link previews (TikTok bio, iMessage, Discord, Messenger): what a shared link shows. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PluggEra" />
  <meta property="og:locale" content="sv_SE" />
  <meta property="og:title" content="PluggEra – plugga smartare, inte längre" />
  <meta property="og:description" content="Färdiga övningsset för åk 7 till gymnasiet och högskoleprovet, en handledare som förklarar, och repetition precis innan du glömmer. Gratis och utan reklam." />
  <meta property="og:image" content="https://pluggera.se/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PluggEra – plugga smartare, inte längre" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Private staging: keep search engines out until the site is public. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2C5CD6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PluggEra" />

  <!-- Typefaces are served from this site (css/fonts.css), not Google Fonts: no third-party request on load. -->
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />

  <!-- Math rendering (KaTeX) only appears inside specific components — most
       pages, including this one's own landing/marketing routes, never use it
       at all. Loaded with media="print" so the browser fetches it at normal
       priority but doesn't block first paint on it; js/boot.js flips it to
       the real media once it's in, so it's already applied by the time any
       page that does render math needs it. The noscript fallback is for the
       no-JS case only (the app itself already requires JS to run at all). -->
  <link id="katex-print-css" rel="stylesheet" href="vendor/katex.min.css" media="print" />
  <noscript><link rel="stylesheet" href="vendor/katex.min.css" /></noscript>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/design.css" />
  <link rel="stylesheet" href="css/landing.css" />

  <script src="vendor/canvas-confetti.min.js" defer></script>
  <script src="vendor/pdf.min.js" defer></script>
  <script src="vendor/katex.min.js" defer></script>
  <script src="vendor/jszip.min.js" defer></script>

  <!-- Sets the palette/font/language attributes <html> needs before first paint (no flash of the
       wrong one) and finishes the KaTeX media-swap above. A plain external script, not inline, so
       this page's Content-Security-Policy (server/src/index.js) needs no 'unsafe-inline' for scripts. -->
  <script src="js/boot.js"></script>
</head>
<body>
  <a class="skiplink" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript>PluggEra needs JavaScript enabled.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
