  <link rel="stylesheet" href="css/fonts.css" />

  <!-- js/main.js (type=module, below) only *discovers* its own imports once it's
       fetched and parsed, and each of those discovers its own in turn — every
       hop costs a full round trip. This is the real cost of native ES modules
       with no bundler: on a fast connection HTTP/2 hides it, on mobile's
       higher RTT it's most of the gap between First Contentful Paint and
       Largest Contentful Paint. modulepreload starts fetching (and, where
       supported, parsing) the whole "app shell" — everything main.js eager-
       imports, transitively, for a first-time visit to "/" — in parallel from
       the moment the HTML is parsed, instead of one hop at a time; module
       *execution* still happens later, in the normal import order, so this
       changes nothing but timing. The list below is main.js's actual eager
       (non-route) import closure, confirmed empirically via a resource-timing
       measurement of a fresh "/" load — re-measure and update it if that
       closure changes (a new eager import in main.js or one of these files). -->
  <link rel="modulepreload" href="js/store.js" />
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/lib/dom.js" />
  <link rel="modulepreload" href="js/lib/a11y.js" />
  <link rel="modulepreload" href="js/lib/i18n.js" />
  <link rel="modulepreload" href="js/lib/activity.js" />
  <link rel="modulepreload" href="js/lib/theme.js" />
  <link rel="modulepreload" href="js/lib/popover.js" />
  <link rel="modulepreload" href="js/lib/achievement-toast.js" />
  <link rel="modulepreload" href="js/lib/session-active.js" />
  <link rel="modulepreload" href="js/lib/strings.js" />
  <link rel="modulepreload" href="js/lib/server-errors.js" />
  <link rel="modulepreload" href="js/lib/markdown.js" />
  <link rel="modulepreload" href="js/lib/sound.js" />
  <link rel="modulepreload" href="js/lib/srs.js" />
  <link rel="modulepreload" href="js/lib/mastery.js" />
  <link rel="modulepreload" href="js/lib/grade.js" />

  <!-- Not part of the shell, but the single most common first route: -->
  <link rel="modulepreload" href="js/views/landing.js" />

  <!-- Set the palette and language before first paint, so there's no flash of
       the wrong theme and <html lang> is right for screen readers from the start. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem("studybuddy.theme");
        root.setAttribute("data-theme", ["light", "paper", "dark", "system"].indexOf(t) >= 0 ? t : "system");
      } catch (e) {
        root.setAttribute("data-theme", "system");
      }
      try {
        var f = localStorage.getItem("studybuddy.font");
        root.setAttribute("data-font", f === "hyperlegible" ? "hyperlegible" : "system");
        var sz = localStorage.getItem("studybuddy.textSize");
        root.setAttribute("data-textsize", ["s", "m", "l"].indexOf(sz) >= 0 ? sz : "m");
      } catch (e) {
        root.setAttribute("data-font", "system");
        root.setAttribute("data-textsize", "m");
      }
      try {
        var supported = ["en", "sv"];
        var l = localStorage.getItem("studybuddy.lang");
        // Every bundled set is Swedish curriculum content, so that's the
        // default when the student hasn't chosen — not a browser-language guess.
        root.setAttribute("lang", supported.indexOf(l) >= 0 ? l : "sv");
      } catch (e) {
        root.setAttribute("lang", "sv");
      }
    })();
  </script>
