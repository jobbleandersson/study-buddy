# Render Blueprint — one web service that serves the frontend + the /api/* server.
# In Render: Blueprints > New Blueprint Instance > pick this repo.
# Secrets (marked `sync: false`) are set in the dashboard, never in git.
# Every push to `main` redeploys automatically.
#
# FREE tier — no card. Trade-offs: the service sleeps after 15 min idle (~50s to
# wake), and the SQLite database resets on every deploy/wake. Fine for testing
# the plumbing. To make it permanent later, add a `disk:` block (mountPath
# /data), set `plan: starter`, and add `DB_PATH=/data/studybuddy.sqlite3`.

services:
  - type: web
    name: study-buddy
    runtime: node
    rootDir: server
    plan: free
    # better-sqlite3 is pinned to 11.10.0 (server/package.json) and compiled
    # from source here — its newer prebuilt binaries segfault on Render's Linux.
    buildCommand: npm_config_build_from_source=true npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: MESSAGES_REQUIRE_AUTH
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
