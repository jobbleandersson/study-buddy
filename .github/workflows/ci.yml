name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      # Exactly what server/package-lock.json says, like the Dockerfile: CI tests what gets deployed.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Validate library content
        run: npm run validate

      - name: Unit tests (js/lib)
        run: npm run test:unit

      - name: Server integration tests
        run: npm run test:server

  # Known vulnerabilities in what the server runs on (not the dev tools: there are none). Shown as its
  # own check but never blocks a merge: a new advisory against an old package would otherwise turn every
  # open branch red overnight. Open the job's log when it is yellow.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: server
